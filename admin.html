<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Bilaspur Rasoi</title>
<style>
/* Admin panel styles */
:root{--g:#5e2a0a;--g2:#7a3a14;--lime:#ffd94e;--bg:#faf5ea;--card:#fff;--ink:#2a1a10;--mut:#7b6a5c;--line:#e6dac5;--red:#b83225;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:96px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:40;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 16px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--lime);color:var(--g);font-weight:800;display:grid;place-items:center;font-size:14px;letter-spacing:.02em}
.brand b{display:block;font-size:16px;line-height:1.15}
.brand small{display:block;opacity:.7;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.top .sp{flex:1}
.top a,.top button{color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .2s}
.top a:hover,.top button:hover{background:rgba(255,255,255,.26)}

main{max-width:760px;margin:0 auto;padding:20px 16px}
.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.welcome h1{font-size:24px;color:var(--g);line-height:1.15}
.stat{font-size:12px;color:var(--mut);text-align:right}
.hint{color:var(--mut);font-size:13.5px}
.msg{font-size:13.5px;margin-top:10px;color:var(--red);min-height:1px}
.msg.ok{color:#2a7a3f}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px rgba(20,40,30,.06)}
.card h2,h2{font-size:18px;color:var(--g);margin-bottom:2px}
.card h3,h3{font-size:15px;margin-bottom:2px}
.login{max-width:420px;margin:30px auto}
.login .lock{width:54px;height:54px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:24px;margin:0 auto 10px}
.login h2,.login .hint{text-align:center}
.login .btn{margin-top:18px}

/* form */
label{display:block;font-size:13px;font-weight:700;margin-top:14px;color:var(--ink)}
label small{font-weight:500;color:var(--mut)}
input[type=text],input[type=email],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;margin-top:6px;font-size:15px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--g);color:#fff;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.block{display:block;width:100%}
.btn.alt{background:#f4e8d3;color:var(--g)}
.btn.red{background:#fdeceb;color:var(--red)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1}

/* tabs & pills */
.tabs{display:flex;gap:4px;background:#f0e3cc;border-radius:14px;padding:4px;margin-bottom:16px;position:sticky;top:62px;z-index:30}
.tabs button{flex:1;border:0;background:none;padding:11px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--g);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-weight:600;font-size:13.5px;cursor:pointer}
.pills button.on{background:var(--g);border-color:var(--g);color:#fff}

/* day accordion */
details{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04)}
details[open]{box-shadow:0 8px 22px rgba(0,0,0,.08)}
summary{list-style:none;padding:15px 16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";margin-left:auto;color:var(--mut)}
details[open] summary::after{content:"▴"}
summary .cnt{font-size:12px;font-weight:500;color:var(--mut)}
details .in{padding:0 16px 16px}
.tag{font-size:11px;background:var(--lime);color:var(--g);border-radius:99px;padding:2px 9px;font-weight:800}
.sec{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border:0}
.sec>h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}

/* editable item list */
.items{display:grid;gap:8px}
.it{display:flex;align-items:center;gap:6px}
.it input{margin:0;flex:1;min-width:0;padding:10px 12px}
.it .no{width:22px;flex:none;text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.it.main input{border-color:var(--g2);background:#f6ecd9;font-weight:700}
.ib{flex:none;width:36px;height:40px;border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:14px;color:var(--mut)}
.ib:hover{background:#f6ecd9}
.ib.x{color:var(--red)}
.ib:disabled{opacity:.3;cursor:default}
.addrow{margin-top:8px}
.badge{display:inline-block;font-size:10.5px;background:var(--g);color:#fff;border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:700;vertical-align:middle}

.days7{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.days7 button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.days7 button.on{background:var(--g);color:#fff;border-color:var(--g)}

/* photos */
.photo{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
.photo .pv{width:120px;height:120px;border-radius:16px;background:#f3e9d8 center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center;padding:6px}
.photo .pv.contain{background-size:contain;background-color:#fff}
input[type=file]{display:none}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:45;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.savebar .dot{flex:1;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:7px;font-weight:600}
.savebar .dot::before{content:"";width:9px;height:9px;border-radius:50%;background:#3fae5a}
.savebar .dot.dirty{color:#a8641f}
.savebar .dot.dirty::before{background:#e7a21b}
.savebar .btn{padding:11px 16px}

/* dialog + toast */
.dlg{border:0;border-radius:20px;padding:22px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg::backdrop{background:rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a140b;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:90%;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
@media(max-width:420px){.top a,.top button{padding:7px 9px;font-size:12px}.brand small{display:none}.photo{grid-template-columns:96px 1fr}.photo .pv{width:96px;height:96px}}
.top a,.top button{white-space:nowrap}
.savebar .btn{white-space:nowrap}
.savebar .dot{font-size:12px;line-height:1.25}
@media(max-width:420px){.brand b{font-size:15px}.savebar .btn{padding:10px 12px;font-size:13.5px}}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">BR</span><div><b>Bilaspur Rasoi</b><small>Admin panel</small></div></div>
  <span class="sp"></span>
  <a href="index.html">View site</a>
  <button id="pwBtn" hidden>Password</button>
  <button id="logout" hidden>Logout</button>
</header>

<main>
  <!-- Login -->
  <section id="auth" class="card login" hidden>
    <div class="lock">&#128274;</div>
    <h2>Admin login</h2>
    <p class="hint">Sign in to manage your menu, text and photos.</p>
    <label>Email<input id="em" type="email" autocomplete="username" placeholder="you@example.com"></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" placeholder="Your password"></label>
    <button class="btn block" id="login">Login</button>
    <p class="msg" id="authMsg"></p>
  </section>

  <!-- Not an admin account -->
  <section id="claim" class="card login" hidden>
    <h2>No admin access</h2>
    <p class="hint" id="claimTxt">This account is not the admin of this website. Please log in with the owner account.</p>
    <button class="btn block alt" id="claimOut">Logout</button>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <div class="welcome"><div><h1>Dashboard</h1><p class="hint" id="who"></p></div><div class="stat" id="stat"></div></div>
    <div class="tabs" id="tabs">
      <button data-t="menu" class="on">Menu</button>
      <button data-t="text">Text</button>
      <button data-t="photos">Photos</button>
    </div>
    <section id="t-menu"></section>
    <section id="t-text" hidden></section>
    <section id="t-photos" hidden></section>
  </div>
</main>

<div class="savebar" id="savebar" hidden>
  <span class="dot" id="dirtyTag">All changes saved</span>
  <button class="btn red" id="resetMenu">Reset</button>
  <button class="btn" id="saveMenu">Save menu</button>
</div>

<dialog id="pwDlg" class="dlg">
  <h2>Change password</h2>
  <p class="hint">Use at least 8 characters.</p>
  <label>New password<input id="np1" type="password" autocomplete="new-password"></label>
  <label>Repeat new password<input id="np2" type="password" autocomplete="new-password"></label>
  <p class="msg" id="pwMsg"></p>
  <div class="row"><button class="btn alt" id="pwCancel">Cancel</button><button class="btn" id="pwSave">Update password</button></div>
</dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
// Admin panel logic (Supabase: login, menu, text, photos)
const { SUPABASE_URL, SUPABASE_KEY } = window.SITE_CONFIG;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const todayIdx = (new Date().getDay() + 6) % 7;
const $ = (s, r = document) => r.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const state = { settings: {}, stamps: {}, menu: clone(window.DEFAULT_MENU), plan: 'veg', tab: 'menu', dirty: false, email: '' };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(text, cls, fn) { const b = el('button', cls, text); b.type = 'button'; if (fn) b.onclick = fn; return b; }
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3400); }
function show(which) {
  ['auth', 'claim', 'app'].forEach(id => $('#' + id).hidden = id !== which);
  $('#logout').hidden = which === 'auth'; $('#pwBtn').hidden = which !== 'app'; syncBar();
}
function syncBar() { $('#savebar').hidden = !(state.tab === 'menu' && !$('#app').hidden); }
function setDirty(v = true) {
  state.dirty = v; const t = $('#dirtyTag');
  t.textContent = v ? 'Unsaved changes' : 'All changes saved'; t.className = 'dot' + (v ? ' dirty' : '');
}
const fmt = d => d ? new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : 'never';

// ---------- auth ----------
async function route() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return show('auth');
  state.email = data.session.user.email || '';
  const { data: adm, error } = await sb.from('admins').select('user_id').maybeSingle();
  if (error) { toast(error.message, true); return show('auth'); }
  if (!adm) return show('claim');
  await loadSettings();
  show('app'); renderAll();
}
async function doLogin() {
  const msg = $('#authMsg'); msg.textContent = '';
  const b = $('#login'); b.disabled = true; b.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  b.disabled = false; b.textContent = 'Login';
  if (error) { msg.textContent = error.message; return; }
  $('#pw').value = ''; route();
}
$('#login').onclick = doLogin;
$('#pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
const logout = async () => { if (state.dirty && !confirm('You have unsaved menu changes. Logout anyway?')) return; state.dirty = false; await sb.auth.signOut(); show('auth'); };
$('#logout').onclick = logout; $('#claimOut').onclick = logout;

// change password
$('#pwBtn').onclick = () => { $('#np1').value = ''; $('#np2').value = ''; $('#pwMsg').textContent = ''; $('#pwDlg').showModal(); };
$('#pwCancel').onclick = () => $('#pwDlg').close();
$('#pwSave').onclick = async () => {
  const a = $('#np1').value, b = $('#np2').value, msg = $('#pwMsg'); msg.className = 'msg';
  if (a.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; return; }
  if (a !== b) { msg.textContent = 'The two passwords do not match.'; return; }
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) { msg.textContent = error.message; return; }
  $('#pwDlg').close(); toast('Password updated ✓');
};

// ---------- data ----------
async function loadSettings() {
  const { data, error } = await sb.from('site_settings').select('key,value,updated_at');
  if (error) return toast(error.message, true);
  state.settings = Object.fromEntries(data.map(r => [r.key, r.value]));
  state.stamps = Object.fromEntries(data.map(r => [r.key, r.updated_at]));
  const m = state.settings.menu;
  state.menu = m && m.veg && m.nonveg && m.breakfast ? clone(m) : clone(window.DEFAULT_MENU);
  if (!state.menu.special_days) state.menu.special_days = [];
  setDirty(false);
}
async function saveSetting(key, value) {
  const now = new Date().toISOString();
  const { error } = await sb.from('site_settings').upsert({ key, value, updated_at: now }, { onConflict: 'key' });
  if (error) throw error;
  state.settings[key] = value; state.stamps[key] = now; renderStat();
}
async function delSetting(key) {
  const { error } = await sb.from('site_settings').delete().eq('key', key);
  if (error) throw error;
  delete state.settings[key]; delete state.stamps[key]; renderStat();
}
function renderStat() {

}

// ---------- reusable editable list ----------
// list: array of strings edited in place. opts.main marks the first row as the main item.
function itemList(list, { main = false, ph = 'Item name', add = '+ Add item', onChange, min = 0 } = {}) {
  const wrap = el('div');
  const changed = () => { setDirty(); onChange && onChange(); };
  const draw = () => {
    wrap.innerHTML = '';
    const box = el('div', 'items');
    list.forEach((t, i) => {
      const row = el('div', 'it' + (main && i === 0 ? ' main' : ''));
      const inp = el('input'); inp.type = 'text'; inp.value = t; inp.maxLength = 60; inp.placeholder = ph;
      inp.oninput = () => { list[i] = inp.value; changed(); };
      inp.onblur = () => { list[i] = inp.value.trim(); };
      const up = btn('↑', 'ib', () => { if (i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; changed(); draw(); } }); up.disabled = i === 0; up.title = 'Move up';
      const dn = btn('↓', 'ib', () => { if (i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; changed(); draw(); } }); dn.disabled = i === list.length - 1; dn.title = 'Move down';
      const x = btn('✕', 'ib x', () => { if (list.length <= min) return toast(`At least ${min} item needed here`, true); list.splice(i, 1); changed(); draw(); }); x.title = 'Remove';
      row.append(inp, up, dn, x);
      box.append(row);
    });
    wrap.append(box);
    const a = btn(add, 'btn alt sm addrow', () => { list.push(''); changed(); draw(); const ins = wrap.querySelectorAll('input'); ins[ins.length - 1].focus(); });
    wrap.append(a);
  };
  draw(); return wrap;
}
const clean = list => { for (let i = list.length - 1; i >= 0; i--) { list[i] = (list[i] || '').trim(); if (!list[i]) list.splice(i, 1); } };

// ---------- menu ----------
function sec(title, node, hint) { const s = el('div', 'sec'); s.append(el('h4', '', title)); if (hint) s.append(Object.assign(el('p', 'hint', hint), { style: 'margin-bottom:8px' })); s.append(node); return s; }
function renderMenu() {
  const box = $('#t-menu'); box.innerHTML = '';
  const plans = [['veg', 'Veg'], ['nonveg', 'Non-veg'], ['breakfast', 'Breakfast'], ['lists', 'Sabji & Bhaji'], ['special', 'Special days']];
  const pills = el('div', 'pills');
  plans.forEach(([k, l]) => pills.append(btn(l, k === state.plan ? 'on' : '', () => { state.plan = k; renderMenu(); })));
  box.append(pills);
  const m = state.menu;

  if (state.plan === 'veg' || state.plan === 'nonveg') {
    box.append(Object.assign(el('p', 'hint', 'Edit any item, reorder with ↑ ↓, remove with ✕, or add new items. The first item (green) is the main dish; "Rice" is shown next to it automatically.'), { style: 'margin-bottom:12px' }));
    DAYS.forEach((d, i) => {
      const o = m[state.plan][i];
      const det = el('details'); if (i === todayIdx) det.open = true;
      const sm = el('summary'); sm.append(d); if (i === todayIdx) sm.append(el('span', 'tag', 'Today'));
      const inn = el('div', 'in');
      inn.append(sec('Lunch', itemList(o.lunch, { main: true, min: 1 })), sec('Dinner', itemList(o.dinner, { main: true, min: 1 })));
      const alt = el('input'); alt.type = 'text'; alt.value = o.dinnerAlt || ''; alt.placeholder = 'e.g. Alternate: Veg biryani or Paneer meal (empty = not shown)';
      alt.oninput = () => { o.dinnerAlt = alt.value; setDirty(); };
      inn.append(sec('Dinner alternate (optional)', alt));
      const tools = el('div', 'row');
      if (state.plan === 'nonveg') tools.append(btn('Copy this day from Veg', 'btn alt sm', () => { if (confirm(`Replace ${d} (Non-veg) with the Veg menu of ${d}?`)) { m.nonveg[i] = clone(m.veg[i]); setDirty(); renderMenu(); } }));
      tools.append(btn('Copy to all days', 'btn alt sm', () => { if (confirm(`Copy ${d}'s menu to every day of the ${state.plan === 'veg' ? 'Veg' : 'Non-veg'} plan?`)) { for (let j = 0; j < 7; j++) if (j !== i) m[state.plan][j] = clone(o); setDirty(); renderMenu(); toast('Copied to all days'); } }));
      inn.append(tools);
      det.append(sm, inn); box.append(det);
    });
  } else if (state.plan === 'breakfast') {
    box.append(Object.assign(el('p', 'hint', 'Breakfast add-on menu. Use "Served with" for the side item (e.g. Tomato sauce, Curd).'), { style: 'margin-bottom:12px' }));
    DAYS.forEach((d, i) => {
      const det = el('details'); if (i === todayIdx) det.open = true;
      const sm = el('summary'); sm.append(d); if (i === todayIdx) sm.append(el('span', 'tag', 'Today'));
      const inn = el('div', 'in');
      const main = el('input'); main.type = 'text'; main.value = m.breakfast[i][0] || ''; main.maxLength = 60; main.placeholder = 'Breakfast item';
      const withs = m.breakfast[i].slice(1);
      const sync = () => { m.breakfast[i] = [main.value.trim() || '—', ...withs]; };
      main.oninput = () => { sync(); setDirty(); };
      inn.append(sec('Breakfast', main), sec('Served with (optional)', itemList(withs, { ph: 'e.g. Tomato sauce', add: '+ Add side item', onChange: sync })));
      det.append(sm, inn); box.append(det);
    });
  } else if (state.plan === 'lists') {
    const c1 = el('div', 'card'); c1.append(el('h3', '', 'Seasonal sabji list'), Object.assign(el('p', 'hint', 'Vegetables available according to the season.'), { style: 'margin-bottom:10px' }), itemList(m.sabji, { add: '+ Add sabji' }));
    const c2 = el('div', 'card'); c2.append(el('h3', '', 'Bhaji list'), Object.assign(el('p', 'hint', 'Shown on the menu page under the weekly menu.'), { style: 'margin-bottom:10px' }), itemList(m.bhaji, { add: '+ Add bhaji' }));
    box.append(c1, c2);
  } else {
    const c = el('div', 'card'); c.append(el('h3', '', 'Special days (★)'), el('p', 'hint', 'Choose the days that get a "★ Special" tag on the menu.'));
    const row = el('div', 'days7');
    DAYS.forEach((d, i) => row.append(btn(d.slice(0, 3), m.special_days.includes(i) ? 'on' : '', function () {
      const at = m.special_days.indexOf(i); if (at >= 0) m.special_days.splice(at, 1); else m.special_days.push(i);
      this.classList.toggle('on'); setDirty();
    })));
    c.append(row); box.append(c);
  }
}
$('#saveMenu').onclick = async () => {
  const m = state.menu;
  for (const p of ['veg', 'nonveg']) for (let i = 0; i < 7; i++) {
    clean(m[p][i].lunch); clean(m[p][i].dinner);
    if (!m[p][i].lunch.length || !m[p][i].dinner.length) { renderMenu(); return toast(`${p === 'veg' ? 'Veg' : 'Non-veg'} · ${DAYS[i]}: Lunch and Dinner need at least 1 item`, true); }
  }
  for (let i = 0; i < 7; i++) { const r = m.breakfast[i]; const t = [r[0], ...r.slice(1).map(x => (x || '').trim()).filter(Boolean)]; m.breakfast[i] = t; }
  clean(m.sabji); clean(m.bhaji);
  const b = $('#saveMenu'); b.disabled = true; b.textContent = 'Saving…';
  try { await saveSetting('menu', clone(m)); setDirty(false); toast('Menu saved ✓ It is live on the website'); renderMenu(); } catch (e) { toast(e.message, true); }
  b.disabled = false; b.textContent = 'Save menu';
};
$('#resetMenu').onclick = async () => {
  if (!confirm('Reset the whole menu to the original (default) menu? Your changes will be lost.')) return;

function textVal(t) {
  if (t.k === 'topbar') return (state.settings.topbar && state.settings.topbar.text) || '';
  return (state.settings.content && state.settings.content[t.k]) || '';
}
function renderText() {
  const box = $('#t-text'); box.innerHTML = '';
  const c = el('div', 'card');
  c.append(el('h2', '', 'Website text'), Object.assign(el('p', 'hint', 'Change the words on your website. Empty field = original text is used.'), { style: 'margin-bottom:4px' }));
  const fields = {};
  TEXTS.forEach(t => {
    const lab = el('label', '', t.label); if (t.hint) lab.append(document.createElement('br'), Object.assign(el('small', '', t.hint)));
    const inp = el(t.area ? 'textarea' : 'input'); if (!t.area) inp.type = 'text';
    inp.maxLength = t.max; inp.value = textVal(t); inp.placeholder = t.def || 'Not shown';
    if (t.area) inp.rows = 2;
    fields[t.k] = inp; lab.append(inp); c.append(lab);
  });
  const row = el('div', 'row');
  row.append(
    btn('Save text', 'btn', async function () {
      this.disabled = true;
      try {
        const content = {}; TEXTS.forEach(t => { if (t.k !== 'topbar') content[t.k] = fields[t.k].value.trim(); });
        const tb = fields.topbar.value.trim();
        if (tb) await saveSetting('topbar', { text: tb }); else if (state.settings.topbar) await delSetting('topbar');
        await saveSetting('content', content);
        toast('Text saved ✓ It is live on the website');
      } catch (e) { toast(e.message, true); }
      this.disabled = false;
    }),
    btn('Reset all text', 'btn alt', async () => {
      if (!confirm('Reset all website text to the original?')) return;
      try { await delSetting('topbar'); await delSetting('content'); renderText(); toast('Text reset ✓'); } catch (e) { toast(e.message, true); }
    }));
  c.append(row); box.append(c);
}

async function resize(file, cfg) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, cfg.max / bmp.width);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const g = c.getContext('2d');
  if (cfg.mime === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, cfg.mime, cfg.q));
}
function renderPhotos() {
  const box = $('#t-photos'); box.innerHTML = '';
  PHOTOS.forEach(p => {
    const cur = state.settings['img_' + p.k];
    const card = el('div', 'card photo');
    const pv = el('div', 'pv' + (p.contain ? ' contain' : ''));
    const src = cur ? cur.url : p.def;
    if (src) pv.style.backgroundImage = `url("${src}")`; else pv.textContent = 'No photo yet';
    const info = el('div');
    info.append(el('h3', '', p.title), el('p', 'hint', p.hint));
    const file = el('input'); file.type = 'file'; file.accept = 'image/*'; file.id = 'f-' + p.k;
    const pick = el('label', 'btn sm'); pick.htmlFor = file.id; pick.textContent = cur ? 'Change photo' : 'Upload photo'; pick.style.cssText = 'display:inline-block;margin:12px 8px 0 0';
    file.onchange = async () => {
      if (!file.files[0]) return;
      pick.textContent = 'Uploading…';
      try {
        const blob = await resize(file.files[0], p);
        const path = `${p.k}-${Date.now()}.${p.ext}`;
        const up = await sb.storage.from('site-images').upload(path, blob, { contentType: p.mime, cacheControl: '31536000' });
        if (up.error) throw up.error;
        const url = sb.storage.from('site-images').getPublicUrl(path).data.publicUrl;
        const old = state.settings['img_' + p.k];
        await saveSetting('img_' + p.k, { url, path });
        if (old && old.path) sb.storage.from('site-images').remove([old.path]);
        toast('Photo saved ✓');
      } catch (e) { toast(e.message || 'Upload failed', true); }
      renderPhotos();
    };
    info.append(file, pick);
    if (cur) {
      const rm = btn(p.def ? 'Use default' : 'Remove', 'btn red sm', async () => {
        if (!confirm('Remove this photo?')) return;
        try { await delSetting('img_' + p.k); if (cur.path) sb.storage.from('site-images').remove([cur.path]); toast('Removed ✓'); } catch (e) { toast(e.message, true); }
        renderPhotos();
      });
      rm.style.marginTop = '12px'; info.append(rm);
    }
    card.append(pv, info); box.append(card);
  });
  box.append(Object.assign(el('p', 'hint', 'Photos go live as soon as they are saved (visitors may need to refresh once).'), { style: 'text-align:center;margin-top:6px' }));
}

route();
